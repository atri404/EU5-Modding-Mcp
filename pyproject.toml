[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eu5-modding-mcp"
version = "2.1.0"
description = "Model Context Protocol server for Europa Universalis V modding documentation, supporting EU5 1.3.x & 1.4 Open Beta"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "GlossMod", email = "gloss@example.com"},
    {name = "atri404"}
]
keywords = [
    "MCP",
    "Model Context Protocol",
    "Europa Universalis V",
    "EU5",
    "Modding",
    "Modifier",
    "Documentation",
    "Jomini"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Games/Entertainment :: Role Playing",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "mcp>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
]

[project.urls]
Homepage = "https://github.com/atri404/EU5-Modding-Mcp"
Repository = "https://github.com/atri404/EU5-Modding-Mcp.git"
Upstream = "https://github.com/GlossMod/EU5-Modding-Mcp"
Documentation = "https://github.com/mrjiaobai-glitch/eu5-modding-kb"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
